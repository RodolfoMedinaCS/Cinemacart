<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Checkout - CinemaCart</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel = "stylesheet" href = "style.css">
    <script defer src="app.js"></script>

    <style>
      .checkout-page{
        max-width: 600px;
        margin: 0 auto;
        padding: 3rem 2rem;
      }

      .checkout-page h1{
        font-size: 2rem;
        color: var(--gold);
        margin-bottom: 2rem;
      }

      .checkout-card{
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        padding: 1.5rem;
        margin-bottom: 1rem;
      }

      .checkout-row{
        display:flex;
        justify-content: space-between;
        font-size: 0.95rem;
        color: #ccc;
        padding: 0.3rem 0;
      }

      .checkout-label {
        font-size: 0.75rem;
        font-weight: bold;
        letter-spacing: 0.1em;
        color: var(--red);
        text-transform: uppercase;
        margin-bottom: 0.8rem;
      }

      .checkout-total-row{
        display:flex;
        justify-content: space-between;
        font-size: 1.2rem;
        font-weight: bold;
        color: var(--white);
        padding-top: 1rem;
        border-top: 1px solid #2a2a2a;
        margin-top: 0.5rem;
      }

      .checkout-total-row span:last-child{
        color: var(--gold);
      }

      .seat-chips{
        display:flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 0.5rem;
      }

      .seat-chip{
        background: #2a2a2a;
        border: 1px solid #444;
        border-radius: 4px;
        padding: 0.3rem 0.7rem;
        font-size: 0.9rem;
        color: var(--white);
      }

      .form-input{
        width: 100%;
        padding: 0.9rem 1rem;
        margin-bottom: 1rem;
        background: #111;
        color: #eee;
        border: 1px solid #333;
        border-radius: 6px;
        font-size: 1rem;
        box-sizing: border-box;
      }

      .form-input:focus{
        outline: none;
        border-color: var(--gold);
      }

      .form-row{
        display: flex;
        gap: 1rem;
      }

      .form-row .form-input{
        flex: 1;
        margin-bottom: 0;
      }

      .form-row .form-input.cvv{
        flex: 0 0 120px;
      }

      .checkout-actions{
        display: flex;
        gap: 1rem;
        margin-top: 1.5rem;
      }

      .btn-back{
        background: transparent;
        color: var(--white);
        border: 2px solid #444;
        padding: 0.8rem 1.6rem;
        cursor: pointer;
        border-radius: 4px;
        font-size: 1rem;
        transition: border-color 0.3s, color 0.3s;
      }

      .btn-back:hover{
        border-color: var(--gold);
        color:var(--gold);
      }

      .btn-pay{
        flex:1;
        padding: 0.9rem;
        font-size:1rem;
      }

    </style>
  </head>

  <body>
    <!-- curtain -->
    <div id="curtain" class="active">
      <div class="curtain left"></div>
      <div class="curtain right"></div>
    </div>

    <!-- navbar -->
  <header>
    <div class="logo">Cinema<span>Cart</span></div>
    <nav>
      <a href="index.html">Home</a>
      <a href="Search.html">Search</a>
      <a href="checkout.html">Cart</a>
      <a href="login.html">Logout</a>
    </nav>
  </header>

  <main>
    <div class="checkout-page">
      <h1>Checkout</h1>

      <!-- order summary-->
      <div class="checkout-card">
        <p class="checkout-label">Order Summary</p>
        <div class="checkout-row">
          <span>Movie</span>
          <span id="coMovieTitle">—</span>
        </div>
        <div class="checkout-row">
          <span>Date</span>
          <span id="coDate">—</span>
        </div>
        <div class="checkout-row">
          <span>Time</span>
          <span id="coTime">—</span>
        </div>
        <div style="margin-top: 0.8rem">
          <p class="checkout-label" style="margin-bottom: 0.5rem;">Seats</p>
          <div class="seat-chips" id="coSeats"></div>
        </div>
      </div>

      <!-- ticket breakdown-->
      <div class="checkout-card">
        <p class="checkout-label">Tickets</p>
        <div id="coTicketRows"></div>
        <div class="checkout-row" style="margin-top: 0.5rem; color: #aaa;">
          <span>Tax (9%)</span>
          <span id="coTax">$0.00</span>
        </div>
        <div class="checkout-total-row">
          <span>Total</span>
          <span id="coTotal">$0.00</span>
        </div>
      </div>

      <!-- payment form -->
      <div class="checkout-card">
        <p class="checkout-label">Payment</p>
        <input class="form-input" type="text" id="cardName" placeholder="Name on Card">
        <input class="form-input" type="text" id="cardNumber" placeholder="Card Number"
        maxlength="19">
        <div class="form-row">
          <input class="form-input" type="text" id="cardExp" placeholder="MM / YY" maxlength="7">
          <input class="form-input cvv" type="text" id="cardCvv" placeholder="CVV" maxlength="4">
        </div>
      </div>

      <div class="checkout-actions">
        <button class="btn-back" id="backBtn">← Back</button>
        <button class="btn btn-pay" id="payBtn">Confirm Booking →</button>
      </div>

    </div>
  </main>

    <!-- Footer -->
    <footer style="background-color: #111; color: #ccc; text-align: center;
  padding: 20px 0; font-size: 1rem; border-top: 1px solid #222;">
      <p style="margin: 5px 0;">
        Email:
        <a href="mailto:support@cinemacart.com" style="color:#e50914;
  text-decoration:none;">support@cinemacart.com</a> |
        Phone:
        <a href="tel:1111111111" style="color:#e50914;
  text-decoration:none;">111-111-1111</a>
      </p>
      <p style="margin: 5px 0;">123 Cinema Street, Movietown, USA</p>
      <p style="margin: 10px 0; font-size: 0.95rem; color:#aaa;">© 2026
        CinemaCart</p>
    </footer>

  <script>
    const curtain = document.getElementById('curtain');

    const movieTitle = localStorage.getItem('selectedMovieTitle') || 'Unknown Movie';
    const selectedDate = localStorage.getItem('selectedDate') || 'Unknown Date';
    const selectedTime = localStorage.getItem('selectedTime') || 'Unknown Time';
    const seats = JSON.parse(localStorage.getItem('selectedSeats') || '[]');
    const adultCount = parseInt(localStorage.getItem('ticketAdult')) || 0;
    const childCount = parseInt(localStorage.getItem('ticketChild')) || 0;
    const seniorCount = parseInt(localStorage.getItem('ticketSenior')) || 0;
    const subtotal = parseFloat(localStorage.getItem('ticketTotalPrice')) || 0;

    document.getElementById('coMovieTitle').textContent = movieTitle;
    document.getElementById('coDate').textContent = selectedDate;
    document.getElementById('coTime').textContent = selectedTime;

    const coSeats = document.getElementById('coSeats');
    seats.forEach(seat => {
      const chip = document.createElement('span');
      chip.className = 'seat-chip';
      chip.textContent = seat;
      coSeats.appendChild(chip);
    });

    const coTicketRows = document.getElementById('coTicketRows');
    const ticketTypes = [
            {label: 'Adult', count: adultCount, price: 14.99},
            {label: 'Child', count: childCount, price: 9.99},
            {label: 'Senior', count: seniorCount, price: 11.99}
    ];

    ticketTypes.forEach(type => {
      if(type.count === 0) return;
      const row = document.createElement('div');
      row.className = 'checkout-row';
      row.innerHTML = `
          <span>${type.label} × ${type.count}</span>
          <span>$${(type.count * type.price).toFixed(2)}</span>
        `;
      coTicketRows.appendChild(row);
    });

    const tax = subtotal * 0.09;
    const total = subtotal + tax;
    document.getElementById('coTax').textContent = '$' + tax.toFixed(2);
    document.getElementById('coTotal').textContent = '$' + total.toFixed(2);

    document.getElementById('backBtn').addEventListener('click', () => {
      curtain.classList.add('active');
      setTimeout(() => {
        window.location.href = 'cart.html';
      }, 1500);
    });

    document.getElementById('payBtn').addEventListener('click', () => {
      const name = document.getElementById('cardName').value.trim();
      const number = document.getElementById('cardNumber').value.trim();
      const exp = document.getElementById('cardExp').value.trim();
      const cvv = document.getElementById('cardCvv').value.trim();

      if(!name || !number || !exp || !cvv){
        alert('Please fill in all payment fields.');
        return;
      }

      curtain.classList.add('active');
      setTimeout(() => {
        window.location.href = 'bookingConfirmed.html';
      }, 1500);
    });
  </script>
  </body>
</html>
