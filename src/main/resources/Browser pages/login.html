<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login – CinemaCart</title>
  <!-- css and js -->
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
</head>
<body>

  <!-- curtains -->
  <div id="curtain" class="active">
    <div class="curtain left"></div>
    <div class="curtain right"></div>
  </div>

  <!-- navbar -->
  <header>
    <a href="index.html" class="logo">Cinema<span>Cart</span></a>
    <nav>
        <a href="index.html">Home</a>
        <a href="Search.html">Search</a>
        <a href="cart.html">Cart</a>
        <a href="login.html">Login</a>
    </nav>
  </header>

  <!-- Login box -->
  <section>

    <div style="
      max-width: 500px;
      margin: 80px auto;
      padding: 40px;
      background: #111;
      border-radius: 10px;
      text-align: center;
    ">

      <h2 id="formTitle">Account Login</h2>

      <form id="authForm" style="margin-top: 30px;">

        <!-- Email input box -->
        <input 
          type="email" 
          id="email"
          placeholder="Email Address"
          required
          style="
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            background-color: #1c1c1c;
            color: #eee;
            border: 1px solid #333;
            border-radius: 6px;
          "
        >

        <!-- Password input -->
        <input 
          type="password" 
          id="password"
          placeholder="Password"
          required
          style="
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            background-color: #1c1c1c;
            color: #eee;
            border: 1px solid #333;
            border-radius: 6px;
          "
        >

        <!-- login button -->
        <button type="submit" class="btn" style="width:100%; padding:15px;">
          Login
        </button>

      </form>

      <!-- Create account toggle -->
      <p style="margin-top: 20px; font-size: 0.9rem;">
        <span id="toggleText">Don't have an account?</span>
        <button id="toggleBtn" type="button" style="background: none; border: none; color: #e50914; cursor: pointer;">
          Create One
        </button>
      </p>

      <!-- Forgot password -->
      <p id="forgotPassword" style="margin-top: 10px; font-size: 0.8rem;">
        <a href="#" style="color:#aaa; text-decoration:none;">
          Forgot Password?
        </a>
      </p>

    </div>

  </section>

  <!-- footer -->
  <footer style="background-color: #111; color: #ccc; text-align: center; padding: 20px 0; font-size: 1rem; border-top: 1px solid #222;">
    <p style="margin: 5px 0;">
      Email: 
      <a href="mailto:support@cinemacart.com" style="color:#e50914; text-decoration:none;">
        support@cinemacart.com
      </a> | 
      Phone: 
      <a href="tel:1111111111" style="color:#e50914; text-decoration:none;">
        111-111-1111
      </a>
    </p>
    <p style="margin: 5px 0;">
      123 Cinema Street, Movietown, USA
    </p>
    <p style="margin: 10px 0; font-size: 0.95rem; color:#aaa;">
      © 2026 CinemaCart
    </p>
  </footer>

  <script>
    const toggleBtn = document.getElementById("toggleBtn");
    const formTitle = document.getElementById("formTitle");
    const toggleText = document.getElementById("toggleText");
    const rememberContainer = document.getElementById("rememberContainer");
    const forgotPassword = document.getElementById("forgotPassword");
    const submitBtn = document.querySelector("#authForm button");

    let isLogin = true;

    toggleBtn.addEventListener("click", () => {
      isLogin = !isLogin;

      if (isLogin) {
        formTitle.textContent = "Account Login";
        submitBtn.textContent = "Login";
        toggleText.textContent = "Don't have an account?";
        toggleBtn.textContent = "Create One";
        if (rememberContainer) rememberContainer.style.display = "block";
        forgotPassword.style.display = "block";
      } else {
        formTitle.textContent = "Create Account";
        submitBtn.textContent = "Create Account";
        toggleText.textContent = "Already have an account?";
        toggleBtn.textContent = "Login";
        if (rememberContainer) rememberContainer.style.display = "none";
        forgotPassword.style.display = "none";
      }
    });

    const authForm = document.getElementById("authForm");

    authForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      if (!email || !password) {
        alert("Please enter a valid email and password.");
        return;
      }

      const action = isLogin ? "login" : "register";

      try {

        const response = await fetch("http://localhost:8000/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action, email, password })
        });

        const text = await response.text();

        let data = {};
        try {
          data = JSON.parse(text);
        } catch {
          data.message = text;
        }

        if (response.status === 200 || response.status === 201) {

          if (action === "login") {
            // Login flow
            sessionStorage.setItem("isLoggedIn", "true");
            sessionStorage.setItem("userEmail", email);

            if (data.sessionToken) {
              sessionStorage.setItem("sessionToken", data.sessionToken);
            }

            sessionStorage.setItem("isManager", data.isManager);

            triggerCurtainAndRedirect();

          } else {
            // Register flow
            alert("Account created! Please log in.");

            // Switch back to login mode
            isLogin = true;
            formTitle.textContent = "Account Login";
            submitBtn.textContent = "Login";
            toggleText.textContent = "Don't have an account?";
            toggleBtn.textContent = "Create One";
            if (rememberContainer) rememberContainer.style.display = "block";
            forgotPassword.style.display = "block";

            // Clear password field for safety
            document.getElementById("password").value = "";
          }

        } else {
          alert(data.message || "Authentication failed.");
        }

      } catch (error) {
        alert("Could not connect to server.");
        console.error(error);
      }

    });

    function triggerCurtainAndRedirect() {
      const curtain = document.getElementById('curtain');
      curtain.classList.add('active');

      setTimeout(() => {
        window.location.href = "account.html";
      }, 1500);
    }
  </script>

</body>
</html>
