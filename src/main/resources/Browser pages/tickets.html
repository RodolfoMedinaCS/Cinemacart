<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Select Seats – CinemaCart</title>
  <!-- css and js -->
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
  
  <!-- Handles the seat map for seat selection -->
  <style>

    .seat-page{
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
      text-align: center;
    }

    .seat-page h1{
      font-size: 2rem;
      color: var(--gold);
      margin-bottom: 0.4rem;
    }

    /*booking summary*/
    .booking-summary{
      color:#aaa;
      font-size: 0.95rem;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .booking-summary span{
      color: var(--white);
    }

    /* Seat spacing */
    .seat-map {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin: 30px 0;
      align-items: center;
    }

    .seat-row {
      display: flex;
      gap: 15px;
      justify-content: center;
    }

    .seat-gap {
      width: 40px;
    }

    /* Seat properties */
    .seat {
      width: 45px;
      height: 45px;
      background-color: #1c1c1c;
      border: 1px solid #333;
      border-radius: 6px;
      color: #eee;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    .seat:hover{
      border-color: var(--gold);
    }

    .seat.selected {
      background-color: #e50914;
      color: #fff;
      border-color: var(--red);
    }

    .seat.occupied {
      background-color: #555;
      cursor: not-allowed;
      border-color: #555;
    }
    /* Screen properties */
    .screen {
      width: 80%;
      height: 25px;
      background-color: #333;
      border-radius: 10px;
      margin-bottom: 90px;
      text-align: center;
      color: #ccc;
      line-height: 25px;
      font-size: 0.9rem;
      margin-left: auto;
      margin-right: auto;
    }

    /*legend colors*/
    .seat-legend{
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 2rem;
      font-size: 0.9rem;
      color:#aaa;
    }

    .legend-item{
      display:flex;
      align-items: center;
      gap: 0.5rem;
    }

    .legend-dot{
      width: 15px;
      height: 15px;
      border-radius: 50%;
    }

    .seat-actions{
      display:flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 2rem;
    }

    .btn-back{
      background: transparent;
      color: var(--white);
      border: 2px solid #444;
      padding: 0.8rem 1.6rem;
      cursor: pointer;
      border-radius: 4px;
      font-size: 1rem;
      transition: border-color 0.3s, color 0.3s
    }

    .btn-back:hover{
      border-color: var(--gold);
      color: var(--gold);
    }

  </style>
</head>
<body style="background-color:#000; color:#eee;">

  <!-- Curtains -->
<div id="curtain" class="active">
  <div class="curtain left"></div>
  <div class="curtain right"></div>
</div>

<!-- Navbar -->
<header>
  <div class="logo">Cinema<span>Cart</span></div>
  <nav>
      <a href="index.html">Home</a>
      <a href="Search.html">Search</a>
      <span id="navAuthLink">
        <a href="login.html">Login</a>
      </span>
  </nav>
</header>

<main>
  <div class="seat-page">

    <h1>Select Your Seats</h1>

    <div class="booking-summary" id="bookingSummary">
      Loading...
    </div>



    <!-- Screen -->
    <div class="screen">SCREEN</div>

    <!-- seat map -->
    <div class="seat-map" id="seat-map"></div>

    <!-- back and continue buttons -->
    <div class="seat-actions">
      <button class="btn-back" id="backBtn">← Back</button>
      <button class="btn" id="continue-btn">Continue →</button>
    </div>

  </div>
</main>

  <!-- Footer -->
  <footer style="background-color: #111; color: #ccc; text-align: center; padding: 20px 0;
  font-size: 1rem; border-top: 1px solid #222;">
    <p style="margin: 5px 0;">
      Email:
      <a href="mailto:support@cinemacart.com" style="color:#e50914; text-decoration:none;">support@cinemacart.com</a> |
      Phone:
      <a href="tel:1111111111" style="color:#e50914; text-decoration:none;">111-111-1111</a>
    </p>
    <p style="margin: 5px 0;">123 Cinema Street, Movietown, USA</p>
    <p style="margin: 10px 0; font-size: 0.95rem; color:#aaa;">© 2026 CinemaCart</p>
  </footer>



<!-- Creates seat assignments -->
<script>
  const curtain = document.getElementById("curtain");

  //show booking summary from local storage
  const movieTitle = localStorage.getItem('selectedMovieTitle') || 'Unknown Movie';
  const selectedDate = localStorage.getItem('selectedDate') || 'Unknown Date';
  const selectedTime = localStorage.getItem('selectedTime') || 'Unknown Time';

  document.getElementById('bookingSummary').innerHTML = `
        <span>${movieTitle}</span> &nbsp;·&nbsp;
        <span>${selectedDate}</span> &nbsp;·&nbsp;
        <span>${selectedTime}</span>
      `;


  // build the seat map
  const rows = ['A','B','C','D','E','F'];
  const seatsPerRow = 8;
  const seatMap = document.getElementById('seat-map');
  let selectedSeats = [];

  rows.forEach(row => {
    const rowDiv = document.createElement('div');
    rowDiv.className = 'seat-row';

    for(let i = 1; i <= seatsPerRow; i++) {
      if(i === 5){
        const gap = document.createElement('div');
        gap.className = 'seat-gap';
        rowDiv.appendChild(gap);
      }

      const seatBtn = document.createElement('button');
      seatBtn.className = 'seat';
      seatBtn.textContent = row + i;

      seatBtn.addEventListener('click', () => {
        if(seatBtn.classList.contains('occupied')) return;

        seatBtn.classList.toggle('selected');
        const seatId = row + i;
        if(seatBtn.classList.contains('selected')){
          selectedSeats.push(seatId);
        }else{
          selectedSeats = selectedSeats.filter(s => s !== seatId);
        }
        localStorage.setItem('selectedSeats', JSON.stringify(selectedSeats));
      });
      rowDiv.appendChild(seatBtn);
    }
    seatMap.appendChild(rowDiv);
  });

  //restore previously selected seats if user goes back to this page
  const prevSeats = JSON.parse(localStorage.getItem('selectedSeats') || '[]');
  prevSeats.forEach(seatId => {
    const btn = [...document.querySelectorAll('.seat')].find(b => b.textContent === seatId);
    if(btn) btn.classList.add('selected');
  });
  selectedSeats = prevSeats;

  //back button
  document.getElementById('backBtn').addEventListener('click', () => {
    curtain.classList.add('active');
    setTimeout(() => {
      window.location.href = 'showtimes.html';
    }, 1500);
  });

  //continue button
  document.getElementById('continue-btn').addEventListener('click', () =>{
    if(selectedSeats.length === 0){
      alert('Please select at least one seat');
      return;
    }
    curtain.classList.add('active');
    setTimeout(() => {
      window.location.href = 'ticketTypes.html';
    }, 1300);
  });
</script>
</body>
</html>
